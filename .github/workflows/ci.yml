name: vpsmonitor CI
on:
  push:
    branches: [main]
    paths: ["agent/**", "internal/**", "*.go", "go.mod", "go.sum", "Dockerfile.*", "deploy/**", "scripts/**", ".github/workflows/**", ".dockerignore", "LICENSE", "NOTICE"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - run: npm ci --ignore-scripts && npm run build
        working-directory: internal/site
      - run: go test -race -p 2 -tags=testing -timeout=20m ./...
      - name: Linux Agent architectures
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/agent-amd64 ./internal/cmd/agent
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/agent-arm64 ./internal/cmd/agent
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"
      - run: npm ci --ignore-scripts && npm run build && sh tests/run.sh
        working-directory: internal/site
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Linux Hub architectures
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/hub-amd64 ./internal/cmd/hub
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/hub-arm64 ./internal/cmd/hub
