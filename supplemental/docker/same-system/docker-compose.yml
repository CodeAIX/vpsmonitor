# Docs: https://vpsmonitor.dev/guide/getting-started
# Env vars: https://vpsmonitor.dev/guide/environment-variables

services:
  vpsmonitor:
    image: henrygd/vpsmonitor:latest
    container_name: vpsmonitor
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    # healthcheck:
    #   test: ['CMD', '/vpsmonitor', 'health', '--url', 'http://localhost:8090']
    #   interval: 120s
    #   start_period: 10s
    #   timeout: 5s

  vpsmonitor-agent:
    image: henrygd/vpsmonitor-agent:latest
    container_name: vpsmonitor-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/vpsmonitor-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/vpsmonitor.sock
      HUB_URL: http://localhost:8090
      TOKEN: <token>
      KEY: "<key>"
    # healthcheck:
    #   test: ['CMD', '/agent', 'health']
    #   interval: 120s
