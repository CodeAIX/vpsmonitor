# Specialized images available for Nvidia / Intel GPUs
#
# Docs: https://vpsmonitor.dev/guide/agent-installation
# Env vars: https://vpsmonitor.dev/guide/environment-variables

services:
  vpsmonitor-agent:
    image: henrygd/vpsmonitor-agent
    container_name: vpsmonitor-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/vpsmonitor-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk1/.vpsmonitor:/extra-filesystems/disk1:ro
    environment:
      LISTEN: 45876
      KEY: "<public key>"
      HUB_URL: "<hub url>"
      TOKEN: "<token>"
    # healthcheck:
    #   test: ['CMD', '/agent', 'health']
    #   interval: 120s
