# Docs: https://vpsmonitor.dev/guide/hub-installation
# Env vars: https://vpsmonitor.dev/guide/environment-variables

services:
  vpsmonitor:
    image: "henrygd/vpsmonitor"
    container_name: "vpsmonitor"
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
