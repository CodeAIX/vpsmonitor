name: vpsmonitor-hub
services:
  hub:
    image: ghcr.io/codeaix/vpsmonitor-hub:${VPSMONITOR_VERSION:-v0.1.0-beta.1}
    restart: unless-stopped
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8090}:8090"
    environment:
      APP_URL: ${HUB_URL:-http://127.0.0.1:8090}
    volumes:
      - ./hub_data:/vpsmonitor_data
