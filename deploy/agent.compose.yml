name: vpsmonitor-agent
services:
  agent:
    container_name: ${VPSMONITOR_AGENT_CONTAINER_NAME:-vpsmonitor-agent}
    image: vpsmonitor-agent:dev
    build:
      context: ..
      dockerfile: Dockerfile.agent
      args:
        VERSION: ${VERSION:-1.0.0-dev}
        COMMIT: ${COMMIT:-unknown}
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      KEY: ${KEY:?Set the Hub public key}
      TOKEN: ${TOKEN:?Set the Agent or universal registration token}
      HUB_URL: ${HUB_URL:?Set the reachable Hub URL}
      DISABLE_SSH: "true"
      VPSMONITOR_NETWORK_SCOPE: host
      VPSMONITOR_TRAFFIC_INTERFACE: ${TRAFFIC_INTERFACE:-auto}
    volumes:
      - ./agent_data:/var/lib/vpsmonitor-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
